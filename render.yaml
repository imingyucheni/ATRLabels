# Render 一键部署：https://render.com/deploy?repo=https://github.com/imingyucheni/ATRLabels
# 部署时会让你填写标记为 sync: false 的变量。数据存放在持久磁盘 /var/data。
services:
  - type: web
    name: atrlabels
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /portal/login
    disk:
      name: atr-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SHIPBEST_API_ID
        sync: false
      - key: SHIPBEST_ACCESS_TOKEN
        sync: false
      # 先用模拟模式测试：1 = 模拟（不会真实下单），确认没问题后改成 0
      - key: SHIPBEST_MOCK
        value: "1"
      # 1 = 首次启动创建演示客户，正式使用前改成 0（或删除）
      - key: DEMO_SEED
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
