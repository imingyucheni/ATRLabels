<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 315 80" role="img" aria-label="OnTrac">
  <!-- 图标：左侧短竖 + 底部半圆 U 形，右上红色横条 -->
  <g fill="none" stroke="#111827" stroke-width="11">
    <path d="M12 16 V24" stroke-linecap="butt"/>
    <path d="M12 40 A22 22 0 0 0 56 40 V22"/>
  </g>
  <path d="M12 12 H28" stroke="#111827" stroke-width="9"/>
  <rect x="40" y="10" width="26" height="9" fill="#e11d2e"/>
  <!-- 字样 -->
  <text x="78" y="62" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#111827" letter-spacing="-1">On</text>
  <text x="151" y="62" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#111827" letter-spacing="-1">Trac</text>
  <!-- T 上面的红杠 -->
  <rect x="170" y="12" width="20" height="8" fill="#e11d2e"/>
</svg>
