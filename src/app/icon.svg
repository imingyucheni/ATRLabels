<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f62f2"/><stop offset=".6" stop-color="#16367f"/><stop offset="1" stop-color="#0b1b34"/></linearGradient>
    <radialGradient id="glow" cx=".28" cy=".12" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe7f7"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c98f"/><stop offset="1" stop-color="#e9a95f"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dd9449"/><stop offset="1" stop-color="#b86e2b"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c47a36"/><stop offset="1" stop-color="#9a5a22"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#020816" flood-opacity=".55"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- 立体大 A -->
  <g filter="url(#sh)">
    <path d="M256 72 L404 432 L328 432 L256 250 L184 432 L108 432 Z" fill="#6f86bf" transform="translate(12 12)"/>
    <path d="M256 72 L404 432 L328 432 L256 250 L184 432 L108 432 Z" fill="url(#face)"/>
  </g>
  <!-- A 中间放一个小纸箱（代替横杠） -->
  <g filter="url(#sh)" transform="translate(256 322) scale(1.18)">
    <path d="M0 -62 L62 -30 L0 2 L-62 -30 Z" fill="url(#top)"/>
    <path d="M-62 -30 L0 2 L0 70 L-62 38 Z" fill="url(#left)"/>
    <path d="M62 -30 L0 2 L0 70 L62 38 Z" fill="url(#right)"/>
    <path d="M-30 -46 L32 -14 L22 -9 L-40 -41 Z" fill="#f3dcb4"/>
    <path d="M22 -9 L32 -14 L32 14 L22 19 Z" fill="#e2c28f"/>
