<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f62f2"/><stop offset=".55" stop-color="#173a8c"/><stop offset="1" stop-color="#0b1b34"/></linearGradient>
    <radialGradient id="glow" cx=".3" cy=".2" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c98f"/><stop offset="1" stop-color="#e9a95f"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d98f45"/><stop offset="1" stop-color="#b86e2b"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c47a36"/><stop offset="1" stop-color="#9a5a22"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020816" flood-opacity=".55"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- 速度线 -->
  <g stroke="#7fd8ff" stroke-linecap="round" opacity=".9">
    <line x1="52" y1="250" x2="130" y2="250" stroke-width="16"/>
    <line x1="76" y1="296" x2="138" y2="296" stroke-width="16" opacity=".75"/>
    <line x1="52" y1="342" x2="126" y2="342" stroke-width="16" opacity=".55"/>
  </g>
  <!-- 3D 纸箱 -->
  <g filter="url(#sh)" transform="translate(290 268)">
    <path d="M0 -150 L140 -78 L0 -6 L-140 -78 Z" fill="url(#top)"/>
    <path d="M-140 -78 L0 -6 L0 160 L-140 88 Z" fill="url(#left)"/>
    <path d="M140 -78 L0 -6 L0 160 L140 88 Z" fill="url(#right)"/>
    <!-- 封箱胶带 -->
    
    <path d="M-66 -116 L74 -44 L52 -33 L-88 -105 Z" fill="#f3dcb4"/>
    <path d="M52 -33 L74 -44 L74 16 L52 27 Z" fill="#e2c28f"/>
    <!-- 面单（贴在左侧面） -->
    <g transform="matrix(1 0.514 0 1 -122 -44)">
      <rect x="0" y="0" width="100" height="84" rx="8" fill="#ffffff"/>
      <rect x="12" y="12" width="46" height="10" rx="5" fill="#2251e0"/>
      <rect x="12" y="30" width="72" height="6" rx="3" fill="#cbd5e1"/>
      <g fill="#0b1b34"><rect x="12" y="46" width="6" height="28"/><rect x="22" y="46" width="3" height="28"/><rect x="29" y="46" width="8" height="28"/><rect x="41" y="46" width="3" height="28"/><rect x="48" y="46" width="6" height="28"/><rect x="58" y="46" width="3" height="28"/><rect x="65" y="46" width="8" height="28"/><rect x="77" y="46" width="5" height="28"/></g>
    </g>
  </g>
</svg>
